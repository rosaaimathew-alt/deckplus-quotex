<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book a Consultation</title>
  <style>
    /* ── Brand ─────────────────────────────────────────────────────────────
       Every look-and-feel choice lives here so the page can match the Deck Plus
       website exactly. Embeds can also override any of these per page with
       data-* attributes (see /embed.js). */
    :root {
      --bg: #ffffff;            /* page background (transparent when embedded) */
      --surface: #f7f7f5;       /* inputs, day chips */
      --border: #dcdcd7;
      --text: #1d1d1f;
      --muted: #6b6b70;
      --accent: #b0894f;        /* buttons, selected states */
      --accent-text: #ffffff;   /* text on accent */
      --accent-soft: color-mix(in srgb, var(--accent) 12%, transparent);   /* selected day, chosen-time banner */
      --danger: #b3261e;
      --ok: #2e7d32;
      --radius: 6px;            /* inputs, chips, time buttons */
      --btn-radius: 6px;        /* main buttons */
      --btn-transform: none;    /* e.g. uppercase */
      --btn-tracking: normal;   /* letter-spacing on buttons */
      --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --heading-font: var(--font);
      --heading-weight: 700;
      --font-size: 15px;
    }
    html.embedded { --bg: transparent; }
    html.embedded .wrap { max-width: none; padding: 4px 3px; }   /* the host page supplies the margins */
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: var(--font-size)/1.5 var(--font); }
    h1, h2 { font-family: var(--heading-font); font-weight: var(--heading-weight); }
    .wrap { max-width: 640px; margin: 0 auto; padding: 24px 16px; }
    h1 { font-size: 1.35rem; margin: 0 0 4px; }
    .sub { color: var(--muted); margin: 0 0 20px; }
    .days { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 16px; scrollbar-width: thin; }
    .day { flex: 0 0 auto; min-width: 68px; padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--radius);
      background: var(--surface); color: var(--text); text-align: center; cursor: pointer; font: inherit; }
    .day small { display: block; color: var(--muted); font-size: .75rem; }
    .day[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
    .slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
    .slot { padding: 10px 0; border: 1px solid var(--accent); border-radius: var(--radius); background: var(--bg);
      color: var(--accent); font: inherit; font-weight: 600; cursor: pointer; }
    .slot:hover, .slot:focus-visible { background: var(--accent); color: var(--accent-text); outline: none; }
    form { display: grid; gap: 12px; }
    label { display: grid; gap: 4px; font-weight: 600; font-size: .9rem; }
    .grid2 { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; }
    .grid3 { display: grid; gap: 12px; grid-template-columns: 2fr 1fr 1fr; }
    @media (max-width: 420px) { .grid3 { grid-template-columns: 1fr 1fr; } .grid3 > :first-child { grid-column: 1 / -1; } }
    .err { color: var(--danger); font-weight: 400; font-size: .8rem; min-height: 0; }
    .err:empty { display: none; }
    [aria-invalid="true"] { border-color: var(--danger); }
    .opt { font-weight: 400; }
    input, select, textarea { font: inherit; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius);
      background: var(--surface); color: var(--text); width: 100%; }
    textarea { min-height: 80px; resize: vertical; }
    .chosen { padding: 12px; margin-bottom: 16px; border-radius: var(--radius); background: var(--accent-soft); }
    .row { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn { padding: 12px 18px; border-radius: var(--btn-radius); border: 1px solid var(--accent); background: var(--accent); color: var(--accent-text);
      font: inherit; font-weight: 700; cursor: pointer; text-transform: var(--btn-transform); letter-spacing: var(--btn-tracking); }
    .btn.ghost { background: transparent; color: var(--accent); border-color: var(--border); }
    .demo { padding: 8px 12px; margin-bottom: 16px; border-radius: var(--radius); border: 1px dashed var(--accent); color: var(--muted); font-size: .85rem; }
    .btn:disabled { opacity: .6; cursor: default; }
    .msg { padding: 10px 12px; border-radius: var(--radius); border: 1px solid var(--danger); color: var(--danger); margin-bottom: 12px; }
    .done { text-align: center; padding: 24px 0; }
    .done .check { font-size: 2.5rem; color: var(--ok); }
    .hp { position: absolute; left: -9999px; }
    .muted { color: var(--muted); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main class="wrap">
    <div id="demoBanner" class="demo" hidden>Preview mode — sample times and reps, nothing is actually booked.</div>
    <h1 id="title">Book a Consultation</h1>
    <p class="sub" id="subtitle">Loading available times…</p>
    <div id="error" class="msg" role="alert" hidden></div>

    <section id="pick" hidden>
      <div class="days" id="days" role="group" aria-label="Choose a day"></div>
      <div class="slots" id="slots" role="group" aria-label="Choose a time"></div>
    </section>

    <section id="details" hidden>
      <div class="chosen" id="chosen"></div>
      <form id="form" novalidate>
        <div class="grid2">
          <label>First name <input name="firstName" autocomplete="given-name" required maxlength="60" /><span class="err" data-for="firstName"></span></label>
          <label>Last name <input name="lastName" autocomplete="family-name" required maxlength="60" /><span class="err" data-for="lastName"></span></label>
        </div>
        <label>Street address <input name="street" autocomplete="address-line1" required maxlength="160" placeholder="123 Main St" /><span class="err" data-for="street"></span></label>
        <div class="grid3">
          <label>City <input name="city" autocomplete="address-level2" required maxlength="80" /><span class="err" data-for="city"></span></label>
          <label>State <select name="state" autocomplete="address-level1" required><option value="">—</option><option>AL</option><option>AK</option><option>AZ</option><option>AR</option><option>CA</option><option>CO</option><option>CT</option><option>DE</option><option>DC</option><option>FL</option><option>GA</option><option>HI</option><option>ID</option><option>IL</option><option>IN</option><option>IA</option><option>KS</option><option>KY</option><option>LA</option><option>ME</option><option>MD</option><option>MA</option><option>MI</option><option>MN</option><option>MS</option><option>MO</option><option>MT</option><option>NE</option><option>NV</option><option>NH</option><option>NJ</option><option>NM</option><option>NY</option><option>NC</option><option>ND</option><option>OH</option><option>OK</option><option>OR</option><option>PA</option><option>RI</option><option>SC</option><option>SD</option><option>TN</option><option>TX</option><option>UT</option><option>VT</option><option>VA</option><option>WA</option><option>WV</option><option>WI</option><option>WY</option><option>PR</option></select><span class="err" data-for="state"></span></label>
          <label>ZIP <input name="zip" autocomplete="postal-code" inputmode="numeric" required maxlength="10" /><span class="err" data-for="zip"></span></label>
        </div>
        <label>Phone <input name="phone" type="tel" autocomplete="tel" required maxlength="20" placeholder="(555) 555-5555" /><span class="err" data-for="phone"></span></label>
        <label>Email <input name="email" type="email" autocomplete="email" required maxlength="200" /><span class="err" data-for="email"></span></label>
        <label><span>Anything we should know? <span class="muted opt">(optional)</span></span> <textarea name="notes" maxlength="2000"></textarea></label>
        <label class="hp" aria-hidden="true">Website <input name="website" tabindex="-1" autocomplete="off" /></label>
        <div class="row">
          <button class="btn" type="submit" id="submit">Confirm booking</button>
          <button class="btn ghost" type="button" id="back">Back</button>
        </div>
      </form>
    </section>

    <section id="done" class="done" hidden>
      <div class="check">✓</div>
      <h2 id="doneTitle">You're booked!</h2>
      <p id="doneText" class="muted"></p>
      <button class="btn ghost" type="button" id="again" hidden>Book another (preview)</button>
    </section>
  </main>

  <script>
    const params = new URLSearchParams(location.search)
    const API = '/api/booking'
    const TZ = Intl.DateTimeFormat().resolvedOptions().timeZone
    const DEMO = params.has('demo')
    if (window.parent !== window) document.documentElement.classList.add('embedded')

    // Per-embed brand overrides (validated so a link can't inject arbitrary CSS).
    const THEME_PARAMS = {
      bg: ['--bg', 'color'], surface: ['--surface', 'color'], border: ['--border', 'color'], text: ['--text', 'color'],
      muted: ['--muted', 'color'], accent: ['--accent', 'color'], accentText: ['--accent-text', 'color'],
      accentSoft: ['--accent-soft', 'color'], radius: ['--radius', 'length'], btnRadius: ['--btn-radius', 'length'],
      btnTransform: ['--btn-transform', 'transform'], btnTracking: ['--btn-tracking', 'length'],
      font: ['--font', 'font'], headingFont: ['--heading-font', 'font'], headingWeight: ['--heading-weight', 'weight'],
      fontSize: ['--font-size', 'length'],
    }
    const OK = {
      color: (v) => CSS.supports('color', v),
      length: (v) => /^-?\d+(\.\d+)?(px|rem|em)?$/.test(v),
      transform: (v) => /^(none|uppercase|lowercase|capitalize)$/.test(v),
      weight: (v) => /^[1-9]00$/.test(v),
      font: (v) => /^[A-Za-z0-9 \-]{1,40}$/.test(v),
    }
    for (const [key, [prop, kind]] of Object.entries(THEME_PARAMS)) {
      let v = params.get(key)
      if (!v || !OK[kind](v)) continue
      if (kind === 'length' && /^-?[\d.]+$/.test(v)) v += 'px'
      if (kind === 'font') {
        // Load it from Google Fonts if it lives there; harmless if it doesn't.
        const link = Object.assign(document.createElement('link'), { rel: 'stylesheet',
          href: `https://fonts.googleapis.com/css2?family=${encodeURIComponent(v)}:wght@400;600;700&display=swap` })
        document.head.append(link)
        v = `"${v}", ui-sans-serif, system-ui, sans-serif`
      }
      document.documentElement.style.setProperty(prop, v)
    }
    if (params.get('title') === 'none') document.getElementById('title').hidden = true

    // ?demo — sample data so the page can be tried before the database is set up.
    const demo = (() => {
      const reps = [{ id: 'demo-1', name: 'Alex' }, { id: 'demo-2', name: 'Brianna' }, { id: 'demo-3', name: 'Chris' }]
      const store = {
        get: () => { try { return JSON.parse(sessionStorage.getItem('rr-demo')) || { turn: 0, taken: [] } } catch { return { turn: 0, taken: [] } } },
        set: (v) => { try { sessionStorage.setItem('rr-demo', JSON.stringify(v)) } catch { /* private mode */ } },
      }
      let state = store.get()
      const slots = () => {
        const out = [], now = new Date()
        for (let d = 1; out.length < 60 && d < 21; d++) {
          const day = new Date(now.getFullYear(), now.getMonth(), now.getDate() + d)
          if (day.getDay() === 0 || day.getDay() === 6) continue
          for (let m = 9 * 60; m < 17 * 60; m += 30) {
            if ((d * 7 + m / 30) % 5 === 0) continue   // a few already-taken times
            const iso = new Date(day.getFullYear(), day.getMonth(), day.getDate(), m / 60 | 0, m % 60).toISOString()
            if (!state.taken.includes(iso)) out.push(iso)
          }
        }
        return out
      }
      return async (method, body) => {
        await new Promise(r => setTimeout(r, 350))
        if (method === 'GET') return [200, { rep: reps[state.turn % 3], meetingTitle: 'Consultation', slotMinutes: 30, slots: slots() }]
        const rep = reps[state.turn % 3]
        state = { turn: state.turn + 1, taken: [...state.taken, body.start] }
        store.set(state)
        return [200, { ok: true, booking: { start: body.start, repName: rep.name } }]
      }
    })()
    async function api(method, body) {
      if (DEMO) { const [status, data] = await demo(method, body); return { ok: status < 300, status, data } }
      const res = await fetch(API, method === 'GET' ? { cache: 'no-store' } : {
        method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      return { ok: res.ok, status: res.status, data: await res.json() }
    }
    if (DEMO) {
      document.getElementById('demoBanner').hidden = false
      document.getElementById('again').hidden = false
      document.getElementById('again').onclick = () => { document.getElementById('form').reset(); load() }
    }

    const $ = (id) => document.getElementById(id)
    const dayKey = (d) => d.toLocaleDateString('en-CA', { timeZone: TZ })
    const fmtTime = (d) => d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })
    const fmtFull = (d) => d.toLocaleString([], { weekday: 'long', month: 'long', day: 'numeric', hour: 'numeric', minute: '2-digit' })
    let state = { rep: null, byDay: new Map(), day: null, start: null }

    function show(section) {
      for (const id of ['pick', 'details', 'done']) $(id).hidden = id !== section
      resize()
    }
    function error(text) { $('error').textContent = text || ''; $('error').hidden = !text; resize() }

    async function load(notice) {
      error(notice)
      $('subtitle').textContent = 'Loading available times…'
      try {
        const res = await api('GET')
        const data = res.data
        if (!res.ok) throw new Error(data.error)
        state.rep = data.rep
        if (data.meetingTitle) { $('title').textContent = 'Book a ' + data.meetingTitle; document.title = $('title').textContent }
        state.byDay = new Map()
        for (const iso of data.slots) {
          const d = new Date(iso)
          const k = dayKey(d)
          if (!state.byDay.has(k)) state.byDay.set(k, [])
          state.byDay.get(k).push(d)
        }
        if (!data.rep || !state.byDay.size) {
          $('subtitle').textContent = 'No times are open right now — please check back soon.'
          $('pick').hidden = true
          return resize()
        }
        $('subtitle').textContent = `${data.slotMinutes}-minute call with ${data.rep.name} · times shown in ${TZ.replace(/_/g, ' ')}`
        if (!state.byDay.has(state.day)) state.day = state.byDay.keys().next().value
        renderDays()
        show('pick')
      } catch (e) {
        $('subtitle').textContent = ''
        error(e.message || 'Could not load times. Please refresh.')
      }
    }

    function renderDays() {
      $('days').replaceChildren(...[...state.byDay.entries()].map(([k, slots]) => {
        const b = document.createElement('button')
        b.className = 'day'; b.type = 'button'
        b.setAttribute('aria-pressed', String(k === state.day))
        b.innerHTML = `<small>${slots[0].toLocaleDateString([], { weekday: 'short' })}</small>
          <strong>${slots[0].toLocaleDateString([], { month: 'short', day: 'numeric' })}</strong>`
        b.onclick = () => { state.day = k; renderDays() }
        return b
      }))
      $('slots').replaceChildren(...state.byDay.get(state.day).map(d => {
        const b = document.createElement('button')
        b.className = 'slot'; b.type = 'button'; b.textContent = fmtTime(d)
        b.onclick = () => pickSlot(d)
        return b
      }))
      resize()
    }

    function pickSlot(d) {
      state.start = d
      error()
      $('chosen').innerHTML = ''
      $('chosen').append(Object.assign(document.createElement('strong'), { textContent: fmtFull(d) }),
        document.createTextNode(` with ${state.rep.name}`))
      show('details')
      $('form').elements.firstName.focus()
    }

    // Same rules the server enforces (api/booking.js validateLead); the server has the final say.
    const FIELDS = ['firstName', 'lastName', 'street', 'city', 'state', 'zip', 'phone', 'email']
    function checkFields(f) {
      const p = {}
      const v = (n) => f[n].value.trim()
      if (!v('firstName')) p.firstName = 'Enter your first name.'
      if (!v('lastName')) p.lastName = 'Enter your last name.'
      if (!/^\d+[A-Za-z]?(-\d+)?\s+\S/.test(v('street'))) p.street = 'Enter your street number and street name.'
      if (!v('city')) p.city = 'Enter your city.'
      if (!v('state')) p.state = 'Choose your state.'
      if (!/^\d{5}(-\d{4})?$/.test(v('zip'))) p.zip = 'Enter a 5-digit ZIP code.'
      if (v('phone').replace(/\D/g, '').replace(/^1(?=\d{10}$)/, '').length !== 10) p.phone = 'Enter a 10-digit phone number.'
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v('email'))) p.email = 'Enter a valid email address.'
      return p
    }
    function showFieldErrors(p) {
      const f = $('form').elements
      for (const n of FIELDS) {
        f[n].setAttribute('aria-invalid', String(!!p[n]))
        document.querySelector(`.err[data-for="${n}"]`).textContent = p[n] || ''
      }
      const first = FIELDS.find(n => p[n])
      if (first) f[first].focus()
      resize()
    }

    // Clear a field's message as soon as it's fixed.
    $('form').addEventListener('input', (ev) => {
      const n = ev.target.name
      if (!FIELDS.includes(n) || ev.target.getAttribute('aria-invalid') !== 'true') return
      if (!checkFields($('form').elements)[n]) {
        ev.target.setAttribute('aria-invalid', 'false')
        document.querySelector(`.err[data-for="${n}"]`).textContent = ''
        if (!document.querySelector('.err:not(:empty)')) error()
        resize()
      }
    })

    $('back').onclick = () => { error(); show('pick') }

    $('form').onsubmit = async (ev) => {
      ev.preventDefault()
      const f = ev.target.elements
      const problems = checkFields(f)
      showFieldErrors(problems)
      if (Object.keys(problems).length) return error('Please complete the highlighted fields.')
      error(); $('submit').disabled = true; $('submit').textContent = 'Booking…'
      try {
        const res = await api('POST', {
            repId: state.rep.id, start: state.start.toISOString(), timeZone: TZ,
            ...Object.fromEntries(FIELDS.map(n => [n, f[n].value])), notes: f.notes.value, website: f.website.value,
        })
        const data = res.data
        if (res.status === 409) return load(data.error)
        if (data.fields) { showFieldErrors(data.fields); throw new Error(data.error) }
        if (!res.ok) throw new Error(data.error)
        $('doneText').textContent = `${fmtFull(new Date(data.booking.start))} with ${data.booking.repName}. A confirmation is on its way to ${f.email.value}.`
        show('done')
        parent.postMessage({ type: 'rr-booked', start: data.booking.start }, '*')
      } catch (e) {
        error(e.message || 'Booking failed — please try again.')
      } finally {
        $('submit').disabled = false; $('submit').textContent = 'Confirm booking'
      }
    }

    // Tell the embedding page how tall we are (see /embed.js).
    function resize() { parent.postMessage({ type: 'rr-height', height: document.documentElement.scrollHeight }, '*') }
    new ResizeObserver(resize).observe(document.body)

    load()
  </script>
</body>
</html>
