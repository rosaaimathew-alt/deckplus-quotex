<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)} body{margin:0;font:14px system-ui,sans-serif} [hidden]{display:none!important}</style>
</head>
<body>
<title>Deck Plus Design Editor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
  /* Layout: toolbar across the top, 2D plan (left) and live 3D (right); stacked on phones. */
  :root {
    --bg: #eef2ef; --panel: #ffffff; --fg: #1b2520; --muted: #5a675f; --line: #d5ddd7;
    --accent: #2c6a4d; --accent-fg: #ffffff; --accent-soft: #e3efe8; --danger: #a23b2a;
    --plan-bg: #f7f8f6; --grid: #e2e6e2; --grid2: #c9d0ca;
    --font-display: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
    --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #111714; --panel: #18201c; --fg: #e4ebe6; --muted: #98a69e; --line: #2a3530;
    --accent: #72c196; --accent-fg: #0c140f; --accent-soft: #1f3128; --danger: #e48b78;
    --plan-bg: #f7f8f6; --grid: #e2e6e2; --grid2: #c9d0ca; color-scheme: dark; } }
  :root[data-theme="dark"] {
    --bg: #111714; --panel: #18201c; --fg: #e4ebe6; --muted: #98a69e; --line: #2a3530;
    --accent: #72c196; --accent-fg: #0c140f; --accent-soft: #1f3128; --danger: #e48b78;
    --plan-bg: #f7f8f6; --grid: #e2e6e2; --grid2: #c9d0ca; color-scheme: dark; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; }
  .app { display: grid; grid-template-rows: auto minmax(0, 1fr); height: 100%; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; background: var(--panel); border-bottom: 1px solid var(--line);
    padding-block: 8px; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); }
  .bar h1 { font: 700 19px/1 var(--font-display); margin: 0 10px 0 0; }
  .grp { display: flex; gap: 3px; align-items: center; padding: 3px; border: 1px solid var(--line); border-radius: 9px; }
  .grp span { font: 600 11px/1 var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 0 6px; }
  button, .btn { font: 600 13px/1 var(--font-body); padding: 8px 10px; border-radius: 7px; border: 0; background: transparent; color: var(--fg); cursor: pointer; }
  button:hover { background: var(--accent-soft); }
  button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button:disabled { opacity: .4; cursor: default; background: transparent; }
  .danger { color: var(--danger); }
  .main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); min-height: 0; }
  .plan-wrap { position: relative; min-width: 0; background: var(--plan-bg); border-right: 1px solid var(--line); }
  #plan { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; user-select: none; }
  .view-wrap { position: relative; min-width: 0; background: #cddfe8; }
  #view { position: absolute; inset: 0; }
  #view canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .props { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--panel); color: var(--fg);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; box-shadow: 0 2px 10px rgba(0,0,0,.12); display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: end; max-width: calc(100% - 24px); }
  .props[hidden] { display: none; }
  .props b { font: 700 15px/1.1 var(--font-display); align-self: center; }
  .props label { display: flex; flex-direction: column; gap: 4px; font: 600 11px/1 var(--font-body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .props input { font: 500 14px/1 var(--font-mono); width: 76px; padding: 6px 7px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); }
  .props .ro { font: 500 13px/1.3 var(--font-mono); color: var(--fg); text-transform: none; letter-spacing: 0; }
  .tip { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); top: 10px; font-size: 12.5px; color: #3c4740; background: rgba(255,255,255,.9); border-radius: 6px; padding: 6px 9px; max-width: 60%; }
  .swatches { display: flex; gap: 4px; }
  .swatches button { width: 24px; height: 24px; border-radius: 50%; padding: 0; border: 2px solid var(--panel); box-shadow: 0 0 0 1px var(--line); }
  .swatches button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--accent); }
  @media (max-width: 860px) {
    html, body { height: auto; }
    .app { height: auto; }
    .main { grid-template-columns: 1fr; }
    .plan-wrap, .view-wrap { height: 52vh; min-height: 320px; }
    .plan-wrap { border-right: 0; border-bottom: 1px solid var(--line); }
    .tip { display: none; }
  }
</style>

<div class="app">
  <div class="bar" role="toolbar" aria-label="Design tools">
    <h1>Design Editor</h1>
    <div class="grp" role="group" aria-label="Tool">
      <button type="button" data-tool="select" aria-pressed="true" title="Select, move, rotate (V)">Select</button>
      <button type="button" data-tool="poly" aria-pressed="false" title="Click corners, click the first corner to finish (D)">Draw deck</button>
    </div>
    <div class="grp" role="group" aria-label="Add">
      <span>Add</span>
      <button type="button" data-add="deck">Deck</button>
      <button type="button" data-add="stairs">Stairs</button>
      <button type="button" data-add="landing">Landing</button>
    </div>
    <div class="grp" role="group" aria-label="Edit">
      <button type="button" id="b-rotl" title="Rotate −15° (Shift+R)">⟲ 15°</button>
      <button type="button" id="b-rotr" title="Rotate +15° (R)">⟳ 15°</button>
      <button type="button" id="b-copy" title="Copy (Ctrl+D)">Copy</button>
      <button type="button" id="b-del" class="danger" title="Delete (Del)">Delete</button>
      <button type="button" id="b-undo" title="Undo (Ctrl+Z)">Undo</button>
      <button type="button" id="b-redo" title="Redo (Ctrl+Shift+Z)">Redo</button>
      <button type="button" id="b-fit" title="Zoom to the project (F)">Fit</button>
    </div>
    <div class="grp" role="group" aria-label="Decking color"><span>Decking</span><div class="swatches" id="swatches"></div></div>
  </div>
  <div class="main">
    <div class="plan-wrap">
      <svg id="plan" aria-label="Plan view" role="img"></svg>
      <div class="tip" id="tip">Drag to move · round handle rotates · square handles resize · scroll to zoom · drag empty space to pan</div>
      <div class="props" id="props" hidden></div>
    </div>
    <div class="view-wrap"><div id="view"></div></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function () {
  // ═══ Model ═══════════════════════════════════════════════════════════════
  // Feet. The house's back wall is the line z = 0; the yard is +z. Angles are degrees,
  // 0 = straight out from the house (+z), clockwise as seen on the plan.
  const RISE_MAX = 7.75 / 12, RUN = 11 / 12, LANDING_DEF = 4, RAIL_H = 3, RAIL_SECTION = 8;
  const COLORS = [['Toasted Sand', '#a07c58'], ['Foggy Wharf', '#a3a4a2'], ['Saddle', '#8a5f42'], ['Spiced Rum', '#6c4632'], ['Island Mist', '#8f9087'], ['PT', '#b09363']];
  let nextId = 1;
  const S = {
    color: 'Toasted Sand',
    els: [
      { id: nextId++, type: 'deck', h: 3, pts: [[-8, 0], [8, 0], [8, 12], [-8, 12]] },
      { id: nextId++, type: 'landing', h: 3, x: 11, z: 9, w: 6, d: 6, rot: 0 },
      { id: nextId++, type: 'stairs', x: 13.1, z: 12, rot: 45, w: 4, manual: true },
    ],
  };
  let sel = null;                 // selected element id
  const byId = (id) => S.els.find(e => e.id === id);
  const $ = (id) => document.getElementById(id);
  const rad = (d) => d * Math.PI / 180;
  const fmt = (ft) => { const t = Math.round(ft * 12), f = Math.floor(t / 12), i = t - f * 12; return `${f}′-${i}″`; };
  const snapV = (v, s = 0.5) => Math.round(v / s) * s;

  // Rectangles (landing) → corner points in plan coordinates
  function rectPts(e) {
    const c = Math.cos(rad(e.rot)), s = Math.sin(rad(e.rot)), hw = e.w / 2, hd = e.d / 2;
    return [[-hw, -hd], [hw, -hd], [hw, hd], [-hw, hd]].map(([u, v]) => [e.x + u * c + v * s, e.z - u * s + v * c]);
  }
  const polyOf = (e) => e.type === 'deck' ? e.pts : e.type === 'landing' ? rectPts(e) : stairFootprint(e);
  const centroid = (pts) => [pts.reduce((a, p) => a + p[0], 0) / pts.length, pts.reduce((a, p) => a + p[1], 0) / pts.length];
  function inPoly(x, z, pts) {
    let inside = false;
    for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
      const [xi, zi] = pts[i], [xj, zj] = pts[j];
      if ((zi > z) !== (zj > z) && x < (xj - xi) * (z - zi) / (zj - zi) + xi) inside = !inside;
    }
    return inside;
  }
  const edges = (pts) => pts.map((p, i) => [p, pts[(i + 1) % pts.length]]);
  function projSeg(px, pz, a, b) {
    const dx = b[0] - a[0], dz = b[1] - a[1], L2 = dx * dx + dz * dz || 1;
    const t = Math.max(0, Math.min(1, ((px - a[0]) * dx + (pz - a[1]) * dz) / L2));
    const qx = a[0] + t * dx, qz = a[1] + t * dz;
    return { t, x: qx, z: qz, d: Math.hypot(px - qx, pz - qz), len: Math.sqrt(L2) };
  }
  // Outward normal of an edge (away from the shape's centre), as a plan angle.
  function outwardAngle(a, b, pts) {
    const [cx, cz] = centroid(pts), mx = (a[0] + b[0]) / 2, mz = (a[1] + b[1]) / 2;
    let nx = b[1] - a[1], nz = -(b[0] - a[0]);
    if (nx * (mx - cx) + nz * (mz - cz) < 0) { nx = -nx; nz = -nz; }
    return Math.atan2(nx, nz) * 180 / Math.PI;
  }

  // Stairs: the top edge is centred on (x, z) and the run goes down in direction rot.
  // Top height = the deck/landing whose edge the top sits on; bottom = a landing under
  // the foot, else grade. Treads are worked out from the drop (7¾″ max rise, 11″ run).
  function platformAt(x, z, notId) {
    let best = null;
    S.els.forEach(e => { if (e.type === 'stairs' || e.id === notId) return; if (inPoly(x, z, polyOf(e)) && (!best || e.h > best.h)) best = e; });
    return best;
  }
  function edgeHost(e) {
    let best = null;
    S.els.forEach(o => {
      if (o.type === 'stairs') return;
      edges(polyOf(o)).forEach(([a, b]) => { const p = projSeg(e.x, e.z, a, b); if (p.d < 0.35 && (!best || p.d < best.d)) best = { el: o, a, b, ...p }; });
    });
    return best;
  }
  function stairInfo(e) {
    const host = edgeHost(e), top = host ? host.el.h : 3;
    const dx = Math.sin(rad(e.rot)), dz = Math.cos(rad(e.rot));
    // For each lower deck/landing, work out where a stair reaching its height would end;
    // if that foot lands on it, stop there (highest one wins). Otherwise run to grade.
    let foot = null, bottom = 0;
    S.els.forEach(o => {
      if (o.type === 'stairs' || o.id === host?.el.id || !(o.h < top - 0.2)) return;
      const n2 = Math.max(1, Math.ceil((top - o.h) / RISE_MAX)), L2 = (n2 - 1) * RUN;
      const fx = e.x + dx * (L2 + 0.45), fz = e.z + dz * (L2 + 0.45);
      if (inPoly(fx, fz, polyOf(o)) && (!foot || o.h > foot.h)) { foot = o; bottom = o.h; }
    });
    const n = Math.max(1, Math.ceil((top - bottom) / RISE_MAX)), len = (n - 1) * RUN;
    return { host, top, bottom, n, rise: (top - bottom) / n, len, foot };
  }
  function stairFootprint(e) {
    const info = stairInfo(e), c = Math.cos(rad(e.rot)), s = Math.sin(rad(e.rot)), hw = e.w / 2, L = Math.max(info.len, 0.6);
    return [[-hw, 0], [hw, 0], [hw, L], [-hw, L]].map(([u, v]) => [e.x + u * c + v * s, e.z - u * s + v * c]);
  }

  // ═══ History ═════════════════════════════════════════════════════════════
  const hist = [], fut = [];
  const snap = () => JSON.stringify({ els: S.els, color: S.color, nextId });
  let lastSaved = snap();
  function commit() { const now = snap(); if (now === lastSaved) return; hist.push(lastSaved); if (hist.length > 100) hist.shift(); fut.length = 0; lastSaved = now; refreshButtons(); }
  function restore(json) { const o = JSON.parse(json); S.els = o.els; S.color = o.color; nextId = o.nextId; lastSaved = json; if (!byId(sel)) sel = null; changed(); }
  function undo() { if (!hist.length) return; fut.push(snap()); restore(hist.pop()); refreshButtons(); }
  function redo() { if (!fut.length) return; hist.push(snap()); restore(fut.pop()); refreshButtons(); }

  // ═══ 2D plan ═════════════════════════════════════════════════════════════
  const svg = $('plan'), NS = 'http://www.w3.org/2000/svg';
  let vb = { x: -22, z: -6, w: 50 };     // view box in feet (height follows the aspect)
  let tool = 'select', draft = null;     // draft: points while drawing a deck
  function vbH() { const r = svg.getBoundingClientRect(); return vb.w * (r.height / Math.max(1, r.width)); }
  function toFt(ev) { const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY; const p = pt.matrixTransform(svg.getScreenCTM().inverse()); return [p.x, p.y]; }
  const el = (tag, attrs, parent) => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); (parent || svg).appendChild(n); return n; };
  const ptsAttr = (pts) => pts.map(p => p.map(v => v.toFixed(3)).join(',')).join(' ');
  const px = () => vb.w / Math.max(1, svg.getBoundingClientRect().width);   // feet per screen pixel

  function drawPlan() {
    const h = vbH();
    svg.setAttribute('viewBox', `${vb.x} ${vb.z} ${vb.w} ${h}`);
    svg.innerHTML = '';
    const P = px();
    // grid: 1′ fine, 5′ bold
    const g = el('g', {});
    for (let x = Math.floor(vb.x); x <= vb.x + vb.w; x++) el('line', { x1: x, y1: vb.z, x2: x, y2: vb.z + h, stroke: x % 5 ? 'var(--grid)' : 'var(--grid2)', 'stroke-width': P * (x % 5 ? 1 : 1.4) }, g);
    for (let z = Math.floor(vb.z); z <= vb.z + h; z++) el('line', { x1: vb.x, y1: z, x2: vb.x + vb.w, y2: z, stroke: z % 5 ? 'var(--grid)' : 'var(--grid2)', 'stroke-width': P * (z % 5 ? 1 : 1.4) }, g);
    // house
    el('rect', { x: vb.x, y: Math.min(vb.z, -40), width: vb.w, height: Math.max(0, -Math.min(vb.z, -40)), fill: '#e4e2dc' });
    el('line', { x1: vb.x, y1: 0, x2: vb.x + vb.w, y2: 0, stroke: '#1a1c38', 'stroke-width': P * 4 });
    const ht = el('text', { x: vb.x + P * 12, y: -P * 10, 'font-size': P * 12, fill: '#8e8c86', 'font-family': 'Barlow, sans-serif', 'font-weight': 700, 'letter-spacing': P * 2 }); ht.textContent = 'EXISTING HOUSE';
    // elements, lowest first
    const order = [...S.els].sort((a, b) => (a.type === 'stairs') - (b.type === 'stairs') || (a.h || 0) - (b.h || 0));
    order.forEach(e => {
      const grp = el('g', { 'data-id': e.id, style: 'cursor:move' });
      if (e.type === 'deck' || e.type === 'landing') {
        const pts = polyOf(e);
        el('polygon', { points: ptsAttr(pts), fill: e.type === 'deck' ? '#f6efe2' : '#efe6d4', stroke: '#1a1c38', 'stroke-width': P * 2, 'stroke-linejoin': 'round' }, grp);
        // board lines parallel to the house
        const zs = pts.map(p => p[1]), xs = pts.map(p => p[0]);
        const clip = `clip${e.id}`; const cp = el('clipPath', { id: clip }, grp); el('polygon', { points: ptsAttr(pts) }, cp);
        const bl = el('g', { 'clip-path': `url(#${clip})` }, grp);
        for (let z = Math.min(...zs) + 5.75 / 12; z < Math.max(...zs); z += 5.75 / 12) el('line', { x1: Math.min(...xs), y1: z, x2: Math.max(...xs), y2: z, stroke: '#d9cbb3', 'stroke-width': P * 0.8 }, bl);
        const [cx, cz] = centroid(pts);
        const t1 = el('text', { x: cx, y: cz - P * 4, 'font-size': P * 13, 'text-anchor': 'middle', fill: '#1a1c38', 'font-family': 'Barlow, sans-serif', 'font-weight': 700 }, grp);
        t1.textContent = e.type === 'deck' ? 'DECK' : 'LANDING';
        const t2 = el('text', { x: cx, y: cz + P * 12, 'font-size': P * 11, 'text-anchor': 'middle', fill: '#4a4c5e', 'font-family': 'Barlow, sans-serif' }, grp);
        t2.textContent = `${fmt(e.h)} high${e.type === 'landing' ? ` · ${fmt(e.w)} × ${fmt(e.d)}` : ''}`;
        // edge lengths
        if (e.id === sel || e.type === 'deck') edges(pts).forEach(([a, b]) => {
          const L = Math.hypot(b[0] - a[0], b[1] - a[1]); if (L < 1.5) return;
          const mx = (a[0] + b[0]) / 2, mz = (a[1] + b[1]) / 2, ang = Math.atan2(b[1] - a[1], b[0] - a[0]) * 180 / Math.PI;
          const [ccx, ccz] = centroid(pts); let nx = -(b[1] - a[1]) / L, nz = (b[0] - a[0]) / L; if (nx * (mx - ccx) + nz * (mz - ccz) < 0) { nx = -nx; nz = -nz; }
          const tx = mx + nx * P * 12, tz = mz + nz * P * 12, up = ang > 90 || ang < -90 ? ang + 180 : ang;
          const t = el('text', { x: tx, y: tz, 'font-size': P * 11, 'text-anchor': 'middle', 'dominant-baseline': 'middle', fill: '#b03a2e', 'font-family': 'JetBrains Mono, monospace', transform: `rotate(${up} ${tx} ${tz})` }, grp);
          t.textContent = fmt(L);
        });
      } else {
        const info = stairInfo(e), pts = stairFootprint(e);
        el('polygon', { points: ptsAttr(pts), fill: '#ffffff', stroke: '#1a1c38', 'stroke-width': P * 2 }, grp);
        const c = Math.cos(rad(e.rot)), s = Math.sin(rad(e.rot)), W = (u, v) => [e.x + u * c + v * s, e.z - u * s + v * c];
        for (let k = 1; k < info.n; k++) { const a = W(-e.w / 2, k * RUN), b = W(e.w / 2, k * RUN); el('line', { x1: a[0], y1: a[1], x2: b[0], y2: b[1], stroke: '#1a1c38', 'stroke-width': P * 1 }, grp); }
        const a0 = W(0, 0.3), a1 = W(0, Math.max(0.6, info.len - 0.2));
        el('line', { x1: a0[0], y1: a0[1], x2: a1[0], y2: a1[1], stroke: '#1a1c38', 'stroke-width': P * 1.2, 'marker-end': 'url(#arrow)' }, grp);
        const tp = W(0, info.len + 1.1);
        const t = el('text', { x: tp[0], y: tp[1], 'font-size': P * 11, 'text-anchor': 'middle', 'dominant-baseline': 'middle', fill: '#1a1c38', 'font-family': 'Barlow, sans-serif', 'font-weight': 600 }, grp);
        t.textContent = `DN ${info.n - 1} treads${info.foot ? ' to landing' : ''}`;
        if (!info.host) { const w = W(0, -0.6); const tw = el('text', { x: w[0], y: w[1], 'font-size': P * 11, 'text-anchor': 'middle', fill: '#b03a2e', 'font-family': 'Barlow, sans-serif', 'font-weight': 700 }, grp); tw.textContent = 'not attached'; }
      }
    });
    const defs = el('defs', {}); const m = el('marker', { id: 'arrow', viewBox: '0 0 6 6', refX: 5, refY: 3, markerWidth: 6, markerHeight: 6, orient: 'auto' }, defs); el('path', { d: 'M0 0L6 3L0 6Z', fill: '#1a1c38' }, m);
    // selection handles
    const e = byId(sel);
    if (e) {
      const pts = polyOf(e), hs = P * 9;
      el('polygon', { points: ptsAttr(pts), fill: 'none', stroke: '#2c6a4d', 'stroke-width': P * 2, 'stroke-dasharray': `${P * 6} ${P * 4}`, 'pointer-events': 'none' });
      if (e.type === 'deck') {
        e.pts.forEach((p, i) => el('rect', { x: p[0] - hs / 2, y: p[1] - hs / 2, width: hs, height: hs, fill: '#fff', stroke: '#2c6a4d', 'stroke-width': P * 2, 'data-h': `v${i}`, style: 'cursor:crosshair' }));
